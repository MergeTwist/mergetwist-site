# Сайт поддержки и политики MergeTwist на GitLab Pages (проект mergetwist/mergetwist-site на gitlab.com).
# В проект кладутся файлы этой папки как есть; адрес — https://mergetwist.gitlab.io/mergetwist-site/
# (в Deploy → Pages выключить «Use unique domain», иначе GitLab выдаст адрес со случайным хвостом).
pages:
  stage: deploy
  script:
    - mkdir -p public && cp *.html public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
